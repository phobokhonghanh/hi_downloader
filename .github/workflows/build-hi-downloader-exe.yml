name: Build Hi Downloader Exe

on:
  push:
    branches: ["deploy/exe", "main"]
    paths:
      - '**.py'
      - 'requirements.txt'
      - 'static/**'
      - '.github/workflows/build-hi-downloader-exe.yml'
  workflow_dispatch:

jobs:
  build_hi_downloader:
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Read version from version.md (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (Test-Path version.md) {
            $raw = (Get-Content version.md).Trim()
            $version = $raw -replace '^v', ''
          } else {
            $version = "1.0.0"
          }
          echo "VERSION=$version" >> $env:GITHUB_ENV

      - name: Read version from version.md (macOS)
        if: runner.os != 'Windows'
        run: |
          if [ -f version.md ]; then
            RAW=$(cat version.md | tr -d '\r\n')
            VERSION=${RAW#v}
          else
            VERSION="1.0.0"
          fi
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install -r requirements.txt

      - name: Copy FFmpeg & FFprobe (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Copy-Item (Get-Command ffmpeg).Source .\ffmpeg.exe
          Copy-Item (Get-Command ffprobe).Source .\ffprobe.exe

      - name: Copy FFmpeg & FFprobe (macOS)
        if: runner.os != 'Windows'
        run: |
          cp $(which ffmpeg) ./ffmpeg
          cp $(which ffprobe) ./ffprobe

      - name: Package with PyInstaller (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          pyinstaller `
            --noconfirm `
            --onefile `
            --name "hi_downloader_${{ env.VERSION }}" `
            --add-data "static;static" `
            --add-binary "ffmpeg.exe;." `
            --add-binary "ffprobe.exe;." `
            run_app.py

      - name: Package with PyInstaller (macOS)
        if: runner.os != 'Windows'
        run: |
          pyinstaller \
            --noconfirm \
            --onefile \
            --name "hi_downloader_macOS_${{ env.VERSION }}" \
            --add-data "static:static" \
            --add-binary "ffmpeg:." \
            --add-binary "ffprobe:." \
            run_app.py
          cd dist
          zip -r "hi_downloader_macOS_${{ env.VERSION }}.zip" "hi_downloader_macOS_${{ env.VERSION }}"

      - name: Upload Artifact (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: hi_downloader_Windows_${{ env.VERSION }}
          path: dist/hi_downloader_${{ env.VERSION }}.exe
          retention-days: 7

      - name: Upload Artifact (macOS)
        if: runner.os != 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: hi_downloader_macOS_${{ env.VERSION }}
          path: dist/hi_downloader_macOS_${{ env.VERSION }}.zip
          retention-days: 7

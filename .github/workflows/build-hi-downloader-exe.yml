name: Build Hi Downloader Exe

on:
  push:
    branches: ["deploy/exe", "main"]
    paths:
      - '**.py'
      - 'requirements.txt'
      - 'static/**'
      - '.github/workflows/build-hi-downloader-exe.yml'
  workflow_dispatch:

jobs:
  build_hi_downloader:
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Read version from version.md (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (Test-Path version.md) {
            $raw = (Get-Content version.md).Trim()
            $version = $raw -replace '^v', ''
          } else {
            $version = "1.0.0"
          }
          echo "VERSION=$version" >> $env:GITHUB_ENV

      - name: Read version from version.md (macOS)
        if: runner.os != 'Windows'
        run: |
          if [ -f version.md ]; then
            RAW=$(cat version.md | tr -d '\r\n')
            VERSION=${RAW#v}
          else
            VERSION="1.0.0"
          fi
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Install dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-cache-dir --upgrade pip setuptools wheel
          python -m pip install --disable-pip-version-check --no-cache-dir pyinstaller -r requirements.txt

      - name: Copy FFmpeg, FFprobe & Whisper (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ffmpeg = Get-Command ffmpeg -ErrorAction SilentlyContinue
          $ffprobe = Get-Command ffprobe -ErrorAction SilentlyContinue
          if ($ffmpeg -and $ffprobe) {
            Copy-Item $ffmpeg.Source .\ffmpeg.exe
            Copy-Item $ffprobe.Source .\ffprobe.exe
            Write-Host "Copied FFmpeg and FFprobe from system PATH."
          } else {
            Write-Host "FFmpeg not found in PATH. Downloading..."
            Invoke-WebRequest -Uri "https://github.com/ffbinaries/ffbinaries-prebuilt/releases/download/v6.1/ffmpeg-6.1-win-64.zip" -OutFile "ffmpeg.zip"
            Invoke-WebRequest -Uri "https://github.com/ffbinaries/ffbinaries-prebuilt/releases/download/v6.1/ffprobe-6.1-win-64.zip" -OutFile "ffprobe.zip"
            Expand-Archive -Path "ffmpeg.zip" -DestinationPath "." -Force
            Expand-Archive -Path "ffprobe.zip" -DestinationPath "." -Force
            Remove-Item "ffmpeg.zip", "ffprobe.zip"
          }

          $whisper = Get-Command whisper -ErrorAction SilentlyContinue
          if ($whisper) {
            Copy-Item $whisper.Source .\whisper.exe
            Write-Host "Copied Whisper from system PATH."
          } else {
            Write-Host "Whisper not found in PATH. Installing CLI..."
            pip install openai-whisper
            $whisper = Get-Command whisper -ErrorAction SilentlyContinue
            if ($whisper) {
              Copy-Item $whisper.Source .\whisper.exe
            }
          }

      - name: Copy FFmpeg, FFprobe & Whisper (macOS)
        if: runner.os != 'Windows'
        run: |
          if command -v ffmpeg >/dev/null 2>&1 && command -v ffprobe >/dev/null 2>&1; then
            cp $(which ffmpeg) ./ffmpeg
            cp $(which ffprobe) ./ffprobe
            echo "Copied FFmpeg and FFprobe from system PATH."
          else
            echo "FFmpeg not found in PATH. Downloading..."
            if [ "$(uname)" = "Darwin" ]; then
              URL_FFMPEG="https://github.com/ffbinaries/ffbinaries-prebuilt/releases/download/v6.1/ffmpeg-6.1-macos-64.zip"
              URL_FFPROBE="https://github.com/ffbinaries/ffbinaries-prebuilt/releases/download/v6.1/ffprobe-6.1-macos-64.zip"
            else
              URL_FFMPEG="https://github.com/ffbinaries/ffbinaries-prebuilt/releases/download/v6.1/ffmpeg-6.1-linux-64.zip"
              URL_FFPROBE="https://github.com/ffbinaries/ffbinaries-prebuilt/releases/download/v6.1/ffprobe-6.1-linux-64.zip"
            fi
            curl -L -o ffmpeg.zip "$URL_FFMPEG"
            curl -L -o ffprobe.zip "$URL_FFPROBE"
            unzip -o ffmpeg.zip
            unzip -o ffprobe.zip
            rm -f ffmpeg.zip ffprobe.zip
            chmod +x ffmpeg ffprobe
          fi

          if command -v whisper >/dev/null 2>&1; then
            cp $(which whisper) ./whisper
            chmod +x ./whisper
          fi

      - name: Package with PyInstaller (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $addBinaries = @("--add-binary", "ffmpeg.exe;.", "--add-binary", "ffprobe.exe;.")
          if (Test-Path ".\whisper.exe") {
            $addBinaries += @("--add-binary", "whisper.exe;.")
          }
          pyinstaller `
            --noconfirm `
            --onefile `
            --additional-hooks-dir "pyinstaller_hooks" `
            --name "hi_downloader_${{ env.VERSION }}" `
            --add-data "static;static" `
            $addBinaries `
            run_app.py

      - name: Package with PyInstaller (macOS)
        if: runner.os != 'Windows'
        run: |
          ADD_BIN="--add-binary ffmpeg:. --add-binary ffprobe:."
          if [ -f "./whisper" ]; then
            ADD_BIN="$ADD_BIN --add-binary whisper:."
          fi
          pyinstaller \
            --noconfirm \
            --onefile \
            --additional-hooks-dir "pyinstaller_hooks" \
            --name "hi_downloader_macOS_${{ env.VERSION }}" \
            --add-data "static:static" \
            $ADD_BIN \
            run_app.py
          cd dist
          zip -r "hi_downloader_macOS_${{ env.VERSION }}.zip" "hi_downloader_macOS_${{ env.VERSION }}"

      - name: Upload Artifact (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: hi_downloader_Windows_${{ env.VERSION }}
          path: dist/hi_downloader_${{ env.VERSION }}.exe
          retention-days: 7

      - name: Upload Artifact (macOS)
        if: runner.os != 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: hi_downloader_macOS_${{ env.VERSION }}
          path: dist/hi_downloader_macOS_${{ env.VERSION }}.zip
          retention-days: 7

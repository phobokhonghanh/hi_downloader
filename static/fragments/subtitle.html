<!-- LEFT PANEL: SUBTITLE CONFIG -->
<div class="panel">
    <div class="panel-header">
        <span>1. Cấu hình phụ đề</span>
    </div>

    <div class="form-group">
        <label>Chế độ nguồn</label>
        <div style="display: flex; gap: 15px; align-items: center; margin-top: 5px;">
            <label style="display: flex; align-items: center; gap: 4px; font-weight: normal; cursor: pointer; font-size: 0.78rem;">
                <input type="radio" name="subtitle-source-mode" value="video" checked style="cursor: pointer;">
                Một video
            </label>
            <label style="display: flex; align-items: center; gap: 4px; font-weight: normal; cursor: pointer; font-size: 0.78rem;">
                <input type="radio" name="subtitle-source-mode" value="folder" style="cursor: pointer;">
                Thư mục video
            </label>
            <label style="display: flex; align-items: center; gap: 4px; font-weight: normal; cursor: pointer; font-size: 0.78rem;">
                <input type="radio" name="subtitle-source-mode" value="srt" style="cursor: pointer;">
                File SRT
            </label>
        </div>
    </div>

    <div class="form-group">
        <label id="lbl-subtitle-source-path">Đường dẫn tệp video</label>
        <div style="display: flex; align-items: center;">
            <input type="text" id="subtitle-source-path" readonly
                style="flex: 1; background: #f1f5f9; font-size: 0.75rem;"
                placeholder="Chọn file video từ hệ thống...">
            <button type="button" class="btn-folder-select" id="btn-subtitle-select-source" title="Chọn nguồn từ hệ thống">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                    stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2 3h10a2 2 0 0 1 2 2z"></path>
                </svg>
            </button>
        </div>
        <div id="subtitle-folder-info" style="display: none; font-size: 0.72rem; color: var(--text-muted); margin-top: 5px; font-weight: 600;">
            Tổng video hợp lệ: <span id="subtitle-folder-count">0</span>
        </div>
    </div>

    <div style="display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-end; margin-top: 15px;">
        <div class="form-group" id="container-subtitle-method" style="flex: 1; min-width: 120px; margin-bottom: 0;">
            <label for="subtitle-method" style="font-size: 0.7rem; margin-bottom: 4px;">Phương thức</label>
            <select id="subtitle-method" style="padding: 6px 8px; font-size: 0.75rem; width: 100%;">
                <option value="whisper" selected>Whisper</option>
                <option value="ocr">OCR (chưa hỗ trợ)</option>
            </select>
        </div>
        
        <div class="form-group" id="container-subtitle-model" style="flex: 1; min-width: 90px; margin-bottom: 0;">
            <label for="subtitle-model" style="font-size: 0.7rem; margin-bottom: 4px;">Mô hình</label>
            <select id="subtitle-model" style="padding: 6px 8px; font-size: 0.75rem; width: 100%;">
                <option value="tiny">tiny</option>
                <option value="base" selected>base</option>
                <option value="small">small</option>
                <option value="medium">medium</option>
            </select>
        </div>
        
        <div class="form-group" id="container-subtitle-language" style="flex: 1; min-width: 120px; margin-bottom: 0;">
            <label for="subtitle-language" style="font-size: 0.7rem; margin-bottom: 4px;">Ngôn ngữ</label>
            <select id="subtitle-language" style="padding: 6px 8px; font-size: 0.75rem; width: 100%;">
                <option value="" selected>Tự động nhận dạng</option>
                <option value="vi">Tiếng Việt</option>
                <option value="en">Tiếng Anh</option>
                <option value="zh">Tiếng Trung</option>
                <option value="ja">Tiếng Nhật</option>
                <option value="ko">Tiếng Hàn</option>
            </select>
        </div>
        
        <div class="form-group" id="container-subtitle-concurrency" style="flex: 0 0 80px; margin-bottom: 0;">
            <label for="subtitle-concurrency" style="font-size: 0.7rem; margin-bottom: 4px;">Song song</label>
            <select id="subtitle-concurrency" style="padding: 6px 8px; font-size: 0.75rem; width: 100%;">
                <option value="1">1</option>
                <option value="2" selected>2</option>
                <option value="3">3</option>
                <option value="4">4</option>
                <option value="5">5</option>
                <option value="6">6</option>
                <option value="7">7</option>
                <option value="8">8</option>
                <option value="9">9</option>
                <option value="10">10</option>
            </select>
        </div>
    </div>

    <div style="display: flex; gap: 10px; margin-top: 20px;">
        <button type="button" class="btn btn-solid-blue" id="btn-subtitle-generate" style="flex: 1; padding: 10px 16px; font-weight: 700; font-size: 0.82rem;">Tạo phụ đề</button>
    </div>
</div>

<!-- RIGHT PANEL: SUBTITLE QUEUE -->
<div class="panel" style="display: flex; flex-direction: column; min-height: 550px;" id="subtitle-queue-panel">
    <div class="panel-header">
        <span>2. Hàng đợi phụ đề</span>
    </div>

    <div id="subtitle-queue-container"></div>
</div>

<!-- SUBTITLE EDITOR MODAL -->
<div id="subtitle-editor-modal" style="display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; overflow: auto; background-color: rgba(0,0,0,0.5); justify-content: center; align-items: center;">
    <div style="background-color: #ffffff; padding: 20px; border: 1px solid var(--panel-border); border-radius: var(--border-radius); width: 90%; max-width: 950px; box-shadow: var(--shadow-lg); display: flex; flex-direction: column; max-height: 85vh; overflow: hidden;">
        
        <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--panel-border); padding-bottom: 12px; margin-bottom: 15px;">
            <div style="display: flex; align-items: center; gap: 10px;">
                <h3 style="margin: 0; font-size: 1.1rem; font-weight: 700;" id="modal-video-title">Biên tập phụ đề</h3>
                <button type="button" class="btn-folder-select" id="btn-modal-open-location" title="Mở vị trí file phụ đề SRT" disabled style="padding: 5px 8px; justify-content: center; align-items: center; height: 30px; width: 34px; margin-left: 0; display: inline-flex;">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path>
                        <polyline points="15 3 21 3 21 9"></polyline>
                        <line x1="10" y1="14" x2="21" y2="3"></line>
                    </svg>
                </button>
            </div>
            <div style="display: flex; align-items: center; gap: 12px;">
                <span id="modal-subtitle-status" style="font-size: 0.72rem; color: var(--text-muted); font-weight: 700;">Trạng thái: Chờ</span>
                <button type="button" class="btn-close-x" id="btn-modal-header-close" title="Đóng" aria-label="Đóng" style="background: none; border: none; padding: 6px; cursor: pointer; color: var(--text-muted); display: flex; align-items: center; justify-content: center; border-radius: 50%; transition: background-color 0.2s ease;">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="18" y1="6" x2="6" y2="18"></line>
                        <line x1="6" y1="6" x2="18" y2="18"></line>
                    </svg>
                </button>
            </div>
        </div>

        <!-- SUBTITLE METADATA STRIP -->
        <div id="subtitle-modal-metadata" style="background: #f8fafc; border: 1px solid var(--panel-border); border-radius: var(--border-radius); padding: 8px 12px; margin-bottom: 10px; font-size: 0.75rem; display: flex; flex-wrap: wrap; gap: 16px; color: var(--text-color);">
            <div><strong>Phương thức:</strong> <span id="sub-meta-method">—</span></div>
            <div><strong>Ngôn ngữ:</strong> <span id="sub-meta-language">—</span></div>
            <div><strong>Tổng số dòng:</strong> <span id="sub-meta-total">—</span></div>
        </div>
        
        <div class="subtitle-toolbar" style="margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; background: #f8fafc; padding: 8px 12px; border-radius: var(--border-radius); border: 1px solid var(--panel-border);">
            <div style="display: flex; align-items: center; gap: 8px;">
                <button type="button" class="btn-text-only" id="btn-modal-merge" disabled style="margin-left: 4px;">Gộp dòng</button>
                <span class="subtitle-separator">|</span>
                <button type="button" class="btn-text-only" id="btn-modal-split" disabled style="margin-right: 4px;">Tách dòng</button>
            </div>
        </div>

        <div style="flex: 1; border: 1px solid var(--panel-border); border-radius: var(--border-radius); overflow-y: auto; min-height: 0; position: relative; background: #ffffff;">
            <table class="subtitle-table" style="width: 100%; border-collapse: collapse; text-align: left; font-size: 0.78rem;">
                <thead style="background: #f1f5f9; position: sticky; top: 0; z-index: 1; border-bottom: 1px solid var(--panel-border);">
                    <tr>
                        <th style="padding: 8px; width: 40px; text-align: center;">
                            <input type="checkbox" id="modal-select-all" style="cursor: pointer;">
                        </th>
                        <th style="padding: 8px; width: 50px;">#</th>
                        <th style="padding: 8px; width: 100px;">Bắt đầu</th>
                        <th style="padding: 8px; width: 100px;">Kết thúc</th>
                        <th style="padding: 8px; width: 80px;">Khoảng cách</th>
                        <th style="padding: 8px;">Nội dung</th>
                        <th style="padding: 8px; width: 80px; text-align: center;">Thao tác</th>
                    </tr>
                </thead>
                <tbody id="modal-subtitle-body">
                    <!-- Dynamic -->
                </tbody>
            </table>
        </div>

        <div style="display: flex; justify-content: flex-end; gap: 10px; border-top: 1px solid var(--panel-border); padding-top: 15px; margin-top: 15px;">
            <button type="button" class="btn btn-solid-blue" id="btn-modal-save" style="padding: 8px 16px;">Lưu thay đổi</button>
            <button type="button" class="btn btn-outline-blue" id="btn-modal-close" style="padding: 8px 16px;">Đóng</button>
        </div>
    </div>
</div>

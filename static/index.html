<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bilibili 4K Downloader</title>

    <link rel="stylesheet" href="/static/css/style.css?v=1">
</head>

<body>
    <div class="app-shell">
        <!-- SIDEBAR -->
        <aside class="sidebar">
            <div class="sidebar-brand">
                <h1>Bilibili Downloader</h1>
                <div class="sub">Hệ thống trích xuất và tải luồng đa tuyến</div>
            </div>
            <nav class="sidebar-nav">
                <button type="button" class="sidebar-nav-button active" id="btn-mode-download">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="margin-right: 10px; min-width: 16px;">
                        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                        <polyline points="7 10 12 15 17 10"></polyline>
                        <line x1="12" y1="15" x2="12" y2="3"></line>
                    </svg>
                    Tải video
                </button>
                <button type="button" class="sidebar-nav-button" id="btn-mode-subtitle">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="margin-right: 10px; min-width: 16px;">
                        <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
                    </svg>
                    Phụ đề
                </button>
                <button type="button" class="sidebar-nav-button" id="btn-mode-translate">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="margin-right: 10px; min-width: 16px;">
                        <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
                    </svg>
                    Dịch phụ đề
                </button>
            </nav>
            <div class="sidebar-footer" style="margin-top: auto; padding: 15px; border-top: 1px solid var(--panel-border);">
                <button type="button" class="btn-settings-gear" id="btn-open-settings" title="Cài đặt" aria-label="Cài đặt">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="margin-right: 10px; min-width: 16px;">
                        <circle cx="12" cy="12" r="3"></circle>
                        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
                    </svg>
                    Cài đặt
                </button>
            </div>
        </aside>

        <!-- MAIN CONTENT AREA -->
        <main class="main-content">

            <!-- STARTUP LOADING / ERROR OVERLAYS -->
            <div id="startup-loading" style="display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 400px; color: var(--text-muted); font-size: 0.85rem; font-weight: 600;">
                <div class="loading-spinner" style="border: 3px solid #cbd5e1; border-top: 3px solid var(--primary); border-radius: 50%; width: 24px; height: 24px; animation: spin 1s linear infinite; margin-bottom: 12px;"></div>
                <span>Đang tải các thành phần giao diện...</span>
            </div>

            <div id="startup-error" style="display: none; flex-direction: column; align-items: center; justify-content: center; min-height: 400px; padding: 20px; text-align: center;">
                <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#ef4444" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="margin-bottom: 16px;">
                    <polygon points="7.86 2 16.14 2 22 7.86 22 16.14 16.14 22 7.86 22 2 16.14 2 7.86 7.86 2"></polygon>
                    <line x1="12" y1="8" x2="12" y2="12"></line>
                    <line x1="12" y1="16" x2="12.01" y2="16"></line>
                </svg>
                <h3 style="color: #ef4444; margin-top: 0; margin-bottom: 8px;">Lỗi tải giao diện</h3>
                <p id="startup-error-message" style="color: var(--text-muted); font-size: 0.78rem; max-width: 400px; margin-bottom: 20px; line-height: 1.5;"></p>
                <button type="button" class="btn btn-solid-blue" id="btn-startup-retry" style="padding: 8px 16px;">Tải lại trang</button>
            </div>

            <!-- APP GRID CONTENT -->
            <div class="app-grid" id="downloader-view" style="display: none;"></div>

            <!-- SUBTITLE GRID CONTENT -->
            <div class="app-grid" id="subtitle-view" style="display: none;"></div>

            <!-- TRANSLATE GRID CONTENT -->
            <div class="app-grid" id="translate-view" style="display: none;"></div>

            <!-- BOTTOM PANEL: LIVE CONSOLE LOG (SHARED SYSTEM LOG FOOTER) -->
            <div class="terminal-panel" id="shared-terminal-panel" style="position: relative; margin-top: 15px;">
                <div class="terminal-header" style="display: flex; justify-content: space-between; align-items: center;">
                    <span>Nhật ký hệ thống thời gian thực</span>
                    <div style="display: flex; gap: 8px;">
                        <button type="button" class="btn-small-folder" id="btn-clear-logs"
                            style="color: #ef4444; border-color: rgba(239, 68, 68, 0.3); text-transform: lowercase;">xóa
                            log</button>
                        <button type="button" class="btn-small-folder" id="btn-copy-logs"
                            style="color: #475569; border-color: #cbd5e1; text-transform: lowercase;">sao chép log</button>
                    </div>
                </div>
                <div class="terminal-body" id="terminal-body">
                    <div class="terminal-line">[LOG] Hệ thống đang sẵn sàng...</div>
                </div>
                <button type="button" id="btn-scroll-bottom" class="btn-scroll-bottom" title="Cuộn xuống log mới nhất"
                    style="display: none;">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                        stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="6 9 12 15 18 9"></polyline>
                    </svg>
                </button>
            </div>

        </main>
    </div>

    <!-- GLOBAL SETTINGS MODAL -->
    <div id="global-settings-modal" style="display: none; position: fixed; z-index: 1100; left: 0; top: 0; width: 100%; height: 100%; overflow: auto; background-color: rgba(0,0,0,0.5); justify-content: center; align-items: center;">
        <div style="background-color: #ffffff; padding: 0; border: 1px solid var(--panel-border); border-radius: var(--border-radius); width: 90%; max-width: 800px; box-shadow: var(--shadow-lg); display: flex; height: 500px; overflow: hidden;">
            <!-- Left Navigation Pane -->
            <div style="width: 200px; border-right: 1px solid var(--panel-border); background: #f8fafc; padding: 20px 10px; display: flex; flex-direction: column; gap: 8px;">
                <h3 style="margin: 0 0 15px 10px; font-size: 0.95rem; font-weight: 700; color: var(--text-color);">Cài đặt</h3>
                <button type="button" class="settings-nav-item active" data-tab="api-keys" style="text-align: left; background: none; border: none; padding: 8px 12px; font-size: 0.8rem; cursor: pointer; font-weight: 600; border-radius: var(--border-radius); width: 100%; color: var(--primary);">
                    API key
                </button>
            </div>
            <!-- Right Pane (Content) -->
            <div id="settings-right-pane" style="flex: 1; display: flex; flex-direction: column; padding: 20px; background: #ffffff;">
                <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--panel-border); padding-bottom: 12px; margin-bottom: 15px;">
                    <h4 style="margin: 0; font-size: 1rem; font-weight: 700;" id="settings-pane-title">Cấu hình API key</h4>
                    <button type="button" class="btn-close-x" id="btn-close-settings-modal" title="Đóng" aria-label="Đóng" style="background: none; border: none; padding: 6px; cursor: pointer; color: var(--text-muted); display: flex; align-items: center; justify-content: center; border-radius: 50%; transition: background-color 0.2s ease;">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                            <line x1="18" y1="6" x2="6" y2="18"></line>
                            <line x1="6" y1="6" x2="18" y2="18"></line>
                        </svg>
                    </button>
                </div>
                <!-- Right Pane body -->
                <div id="settings-pane-body" style="flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 20px;">
                    <!-- Dynamic provider list will be injected here -->
                </div>
            </div>
        </div>
    </div>

    <!-- QUICK PROVIDER KEY ENTRY MODAL -->
    <div id="quick-key-modal" style="display: none; position: fixed; z-index: 1200; left: 0; top: 0; width: 100%; height: 100%; overflow: auto; background-color: rgba(0,0,0,0.5); justify-content: center; align-items: center;">
        <div style="background-color: #ffffff; padding: 20px; border: 1px solid var(--panel-border); border-radius: var(--border-radius); width: 90%; max-width: 450px; box-shadow: var(--shadow-lg); display: flex; flex-direction: column;">
            <h3 style="margin: 0 0 15px 0; font-size: 1rem; font-weight: 700;" id="quick-key-title">Cấu hình API key</h3>
            
            <div class="form-group" style="margin-bottom: 15px;">
                <label for="quick-key-input" id="quick-key-label" style="font-size: 0.75rem; margin-bottom: 5px; display: block;">API key</label>
                <input type="password" id="quick-key-input" placeholder="Nhập khoá API..." style="width: 100%; font-size: 0.78rem; padding: 8px;">
                <div style="display: flex; align-items: center; justify-content: space-between; margin-top: 8px;">
                    <label style="display: flex; align-items: center; gap: 4px; font-weight: normal; cursor: pointer; font-size: 0.72rem; margin-bottom: 0;">
                        <input type="checkbox" id="quick-key-persist" style="cursor: pointer;">
                        Ghi nhớ lâu dài (OS Secret Service)
                    </label>
                </div>
            </div>

            <div style="display: flex; gap: 10px; justify-content: flex-end; border-top: 1px solid var(--panel-border); padding-top: 15px; margin-top: 10px;">
                <button type="button" class="btn btn-outline-blue" id="btn-quick-key-cancel" style="padding: 6px 12px; font-size: 0.75rem;">Hủy</button>
                <button type="button" class="btn btn-solid-blue" id="btn-quick-key-save" style="padding: 6px 12px; font-size: 0.75rem;">Lưu khoá</button>
            </div>
        </div>
    </div>

    <script type="module" src="/static/js/bootstrap.js?v=2"></script>
</body>
</html>
